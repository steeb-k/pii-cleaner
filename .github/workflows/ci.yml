name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Core sanitizer unit tests.
      - run: node --test "core/test/*.test.js"

      # Web app's static/no-network + serve.py checks only.
      # browser.test.js (headless Chromium) needs a chromium binary and is
      # intentionally NOT run in CI; see apps/web/test/README.md. Run it
      # locally before release.
      - run: node --test apps/web/test/nonetwork.test.js

      # CLI host tests.
      - run: node --test "apps/cli/test/*.test.js"

      # Build the deployable static web bundle and sanity-check its output.
      - run: bash scripts/build-web.sh
      - run: test -f dist/web/sanitizer.js

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: swift test --package-path apps/macos

      # Ad-hoc signed here; release.yml is where the Developer ID signing and
      # notarization happen. Universal, so the x86_64 slice compiles on every push.
      - run: bash apps/macos/build-app.sh
        env:
          OBFUSCATE_UNIVERSAL: '1'

      # The built app carries exactly one entitlement (JavaScriptCore's JIT under the
      # hardened runtime) and no network entitlement of any kind. It is not sandboxed: the
      # updater replaces the bundle in place. No-network is pinned by NoNetworkTests.
      - name: Check entitlements
        run: |
          codesign -d --entitlements - "dist/macos/Obfuscate.app" > ents.txt 2>&1
          cat ents.txt
          grep -q "com.apple.security.cs.allow-jit" ents.txt
          # Exactly that one entitlement. (`if` instead of a bare `! grep`, which `bash -e`
          # ignores unless it happens to be the last command.)
          test "$(grep -o 'com\.apple\.[A-Za-z0-9.-]*' ents.txt | sort -u | wc -l | tr -d ' ')" = 1
          if grep -q "network" ents.txt; then echo "network entitlement found"; exit 1; fi
          if grep -q "app-sandbox" ents.txt; then echo "the app must not be sandboxed (the updater replaces it in place)"; exit 1; fi
